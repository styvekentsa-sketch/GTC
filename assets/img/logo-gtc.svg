<svg xmlns="http://www.w3.org/2000/svg" width="710" height="390" viewBox="320 18 710 390" role="img" aria-labelledby="gtc-logo-title gtc-logo-desc">
  <title id="gtc-logo-title">GTC — Global Trading Corporation</title>
  <desc id="gtc-logo-desc">Logo avec un globe bleu, une flèche orbitale dorée et les lettres GTC.</desc>

  <defs>
    <linearGradient id="gtc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38b8ee"/>
      <stop offset=".48" stop-color="#1263b7"/>
      <stop offset="1" stop-color="#082d72"/>
    </linearGradient>

    <linearGradient id="gtc-gold" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f5d36b"/>
      <stop offset=".45" stop-color="#c99216"/>
      <stop offset="1" stop-color="#8f6508"/>
    </linearGradient>

    <radialGradient id="gtc-ocean" cx="32%" cy="25%" r="80%">
      <stop offset="0" stop-color="#79d9ff"/>
      <stop offset=".48" stop-color="#1685d0"/>
      <stop offset="1" stop-color="#073779"/>
    </radialGradient>

    <clipPath id="gtc-globe-clip">
      <circle cx="590" cy="250" r="103"/>
    </clipPath>
  </defs>

  <!-- globe -->
  <circle cx="590" cy="250" r="111" fill="#ffffff"/>
  <circle cx="590" cy="250" r="103" fill="url(#gtc-ocean)"/>

  <g clip-path="url(#gtc-globe-clip)" fill="#d7e9f4" opacity=".96">
    <path d="M515 174l20-11 16 7 4 14-15 11-5 19-18 7-12 19-19-5-8-18 10-17 13-7 2-12z"/>
    <path d="M550 211l17 7 10 17-4 19 12 17-7 23-12 16-7 31-13-4-8-28-12-16 1-22-11-14 7-20 12-11z"/>
    <path d="M592 170l20-12 22 6 10 16 20 4 8 14-12 12-21-4-10 15-20-5-6-17-17-7z"/>
    <path d="M632 220l22-13 23 7 10 18-8 17-18 2-9 18-16-3-10-20z"/>
    <path d="M657 278l16-6 11 13-5 20-16 9-11-11z"/>
    <path d="M574 146l20-9 18 8-8 13-21 2z"/>
    <path d="M488 257l14-5 11 13-5 15-15 3-8-12z"/>
  </g>

  <ellipse cx="557" cy="211" rx="38" ry="20" fill="#ffffff" opacity=".14" transform="rotate(-28 557 211)"/>

