<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1F2630">
    <title>Hors connexion | Dashboard GTC</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #F4F6F9;
            font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1F2630;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
            text-align: center;
        }
        img { width: 150px; height: auto; margin-bottom: 20px; }
        h1 { margin: 0 0 8px; font-size: 20px; }
        p { margin: 0 0 24px; color: #5B6575; }
        button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border: 0;
            border-radius: 10px;
            background: #004B87;
            color: #fff;
            font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            cursor: pointer;
        }
        button:hover { background: #003866; }
    </style>
</head>
<body>
    <main class="card">
        <img src="../assets/img/logo-gtc.svg" alt="Global Trading Corporation" width="150" height="79">
        <h1>Pas de connexion internet</h1>
        <p>Le Dashboard a besoin d'une connexion pour afficher les données à jour. Vérifiez votre réseau puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
